# GM Delivery Demo — infraestrutura gratuita para o Render.
# Banco/Auth/Realtime/Storage continuam no Supabase; Redis REST continua no Upstash.
# Os tres processos usam Web Services gratuitos e acordam sob demanda.
# A sessao WhatsApp e efemera: apos restart/spin-down, escaneie o QR novamente.

services:
  - type: web
    name: gm-delivery-demo-gm
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: INTERNAL_SECRET
        generateValue: true
      - key: INTERNAL_CRON_SECRET
        generateValue: true
      - key: CPF_ENCRYPTION_KEY
        generateValue: true
      - key: NUVEMSHOP_OAUTH_ENCRYPTION_KEY
        generateValue: true
      - key: WAHA_BYO_ENCRYPTION_KEY
        generateValue: true
      - key: AI_CRED_AES_KEY
        generateValue: true
      - key: IMPERSONATE_COOKIE_SECRET
        generateValue: true
      - key: WAHA_API_BASE_URL
        value: https://gm-delivery-waha-demo-gm.onrender.com
      - key: WAHA_API_KEY
        fromService: { type: web, name: gm-delivery-waha-demo-gm, envVarKey: WAHA_API_KEY }
      - key: WAHA_HMAC_SECRET
        fromService:
          { type: web, name: gm-delivery-waha-demo-gm, envVarKey: WHATSAPP_HOOK_HMAC_KEY }
      - key: WAHA_WEBHOOK_REQUIRE_SIGNATURE
        value: "true"
      - key: WAHA_WEBHOOK_BASE_URL
        value: https://gm-delivery-demo-gm.onrender.com
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://gm-delivery-demo-gm.onrender.com
      - key: NEXT_PUBLIC_ADMIN_URL
        value: https://gm-delivery-demo-gm.onrender.com
      - key: DEMO_WORKER_WAKE_URL
        value: https://gm-delivery-worker-demo-gm.onrender.com/healthz
      - key: DEMO_WAHA_WAKE_URL
        value: https://gm-delivery-waha-demo-gm.onrender.com/api/server/health
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false
      - key: AGENT_DISPATCH_CONSUMER
        value: engine
      - key: EVENT_LOG_WORKER_ENABLED
        value: "false"
      - key: INTERNAL_AGENT_RUN_STUB
        value: "false"
      - key: NUVEMSHOP_ENABLED
        value: "false"

  - type: web
    name: gm-delivery-worker-demo-gm
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HEALTH_PORT
        value: "10000"
      - key: NEXT_PUBLIC_SUPABASE_URL
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: NEXT_PUBLIC_SUPABASE_URL }
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        fromService:
          { type: web, name: gm-delivery-demo-gm, envVarKey: NEXT_PUBLIC_SUPABASE_ANON_KEY }
      - key: SUPABASE_SERVICE_ROLE_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: SUPABASE_SERVICE_ROLE_KEY }
      - key: SUPABASE_DB_URL
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: SUPABASE_DB_URL }
      - key: INTERNAL_SECRET
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: INTERNAL_SECRET }
      - key: INTERNAL_CRON_SECRET
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: INTERNAL_CRON_SECRET }
      - key: CPF_ENCRYPTION_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: CPF_ENCRYPTION_KEY }
      - key: NUVEMSHOP_OAUTH_ENCRYPTION_KEY
        fromService:
          { type: web, name: gm-delivery-demo-gm, envVarKey: NUVEMSHOP_OAUTH_ENCRYPTION_KEY }
      - key: WAHA_BYO_ENCRYPTION_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: WAHA_BYO_ENCRYPTION_KEY }
      - key: AI_CRED_AES_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: AI_CRED_AES_KEY }
      - key: IMPERSONATE_COOKIE_SECRET
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: IMPERSONATE_COOKIE_SECRET }
      - key: WAHA_API_BASE_URL
        value: https://gm-delivery-waha-demo-gm.onrender.com
      - key: WAHA_API_KEY
        fromService: { type: web, name: gm-delivery-waha-demo-gm, envVarKey: WAHA_API_KEY }
      - key: WAHA_HMAC_SECRET
        fromService:
          { type: web, name: gm-delivery-waha-demo-gm, envVarKey: WHATSAPP_HOOK_HMAC_KEY }
      - key: WAHA_WEBHOOK_REQUIRE_SIGNATURE
        value: "true"
      - key: WAHA_WEBHOOK_BASE_URL
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: WAHA_WEBHOOK_BASE_URL }
      - key: UPSTASH_REDIS_REST_URL
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: UPSTASH_REDIS_REST_URL }
      - key: UPSTASH_REDIS_REST_TOKEN
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: UPSTASH_REDIS_REST_TOKEN }
      - key: NEXT_PUBLIC_APP_URL
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: NEXT_PUBLIC_APP_URL }
      - key: NEXT_PUBLIC_ADMIN_URL
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: NEXT_PUBLIC_ADMIN_URL }
      - key: ANTHROPIC_API_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: ANTHROPIC_API_KEY }
      - key: OPENAI_API_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: OPENAI_API_KEY }
      - key: OPENROUTER_API_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: OPENROUTER_API_KEY }
      - key: AGENT_DISPATCH_CONSUMER
        value: engine
      - key: RAG_EMBEDDING_API_KEY
        fromService: { type: web, name: gm-delivery-demo-gm, envVarKey: OPENAI_API_KEY }

  - type: web
    name: gm-delivery-waha-demo-gm
    runtime: image
    plan: free
    region: virginia
    numInstances: 1
    image:
      url: devlikeapro/waha:latest-2026.7.2
    envVars:
      - key: PORT
        value: "3000"
      - key: WHATSAPP_DEFAULT_ENGINE
        value: NOWEB
      - key: WAHA_API_KEY
        generateValue: true
      - key: WHATSAPP_HOOK_URL
        value: https://gm-delivery-demo-gm.onrender.com/api/v1/webhooks/waha
      - key: WHATSAPP_HOOK_EVENTS
        value: message,message.any,message.ack,message.edited,message.revoked,session.status,state.change
      - key: WHATSAPP_HOOK_HMAC_KEY
        generateValue: true
      - key: WAHA_DASHBOARD_ENABLED
        value: "false"
      - key: WAHA_PRINT_QR
        value: "false"
      - key: WAHA_WORKER_RESTART_SESSIONS
        value: "true"
